<section id="top" aria-labelledby="hero-title" class="sky-space flex min-h-[780px] flex-col">
  <div
    class="mx-auto flex w-full max-w-[1440px] grow flex-wrap items-center gap-12 px-6 pt-8 pb-16 md:px-16"
  >
    <div class="flex min-w-0 flex-[1_1_480px] flex-col gap-7">
      <ul class="flex flex-wrap gap-3 font-pixel text-[13px]">
        <li class="rounded-md border border-steel bg-surface px-3 py-2">{{ profile.level }}</li>
        <li class="rounded-md border border-steel bg-surface px-3 py-2">{{ profile.city }}</li>
        <li class="rounded-md border border-steel bg-surface px-3 py-2">Alt 384,400 km</li>
      </ul>
      <h1
        id="hero-title"
        class="text-5xl leading-[1.05] font-bold tracking-tighter break-words md:text-7xl"
      >
        {{ profile.name }}
      </h1>
      <p class="max-w-[560px] text-xl leading-relaxed text-cream-dim md:text-2xl">
        {{ profile.tagline }}
      </p>
      <div class="flex flex-wrap gap-4">
        <a
          href="#projects"
          class="inline-flex min-h-13 items-center rounded-lg bg-cream px-7 font-semibold text-space hover:bg-sky"
          >View projects</a
        >
        <a
          href="#contact"
          class="inline-flex min-h-13 items-center rounded-lg border border-steel bg-space px-7 font-semibold hover:border-sky hover:text-sky"
          >Let's talk</a
        >
      </div>
    </div>

    <div class="flex min-w-0 flex-[1.4_1_420px] justify-center">
      <app-moon-scene
        label="A bearded astronaut floating on his back in space, hands behind his head, with his helmet, a laptop and a game controller drifting beside him"
      />
    </div>
  </div>

  <p class="flex items-center justify-center gap-2.5 pb-7 font-pixel text-xs text-muted">
    <svg aria-hidden="true" width="12" height="10" viewBox="0 0 12 10">
      <polygon points="0,0 12,0 6,10" fill="#e9f0c9" />
    </svg>
    Scroll down to descend
  </p>
</section>
